<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Thom – Thom van der Vlugt</title>
  <meta name="description" content="Flappy Thom: a little Flappy Bird-style game on the website of Thom van der Vlugt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Thom van der Vlugt</a>
      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About me</a></li>
        <li><a href="game.html" aria-current="page">Flappy Thom</a></li>
        <li><a href="tractor.html">Tractor Run</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Flappy Thom</h1>
      <p class="lead">Tap, click or press Space to flap. Fly through the neon pipes! Press M to mute.</p>

      <div class="game">
        <canvas id="game-canvas" class="game-canvas" width="400" height="600"
                aria-label="Flappy Thom game. Tap, click or press Space to flap."></canvas>

        <!-- Name entry for a new high score; shown by game.js only when needed -->
        <form id="score-form" class="score-form" hidden>
          <label for="score-name">NEW HIGH SCORE! Enter your name</label>
          <div class="score-form-row">
            <input id="score-name" class="score-input" type="text" name="nickname"
                   maxlength="12" autocomplete="nickname" required>
            <button class="score-save" type="submit">Save</button>
          </div>
        </form>

        <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">Sound: on</button>
      </div>

      <section class="leaderboard" aria-labelledby="leaderboard-title">
        <h2 id="leaderboard-title">Leaderboard</h2>
        <p class="leaderboard-note">Scores are saved on this device only.</p>
        <p id="score-empty" class="leaderboard-empty">No scores yet. Be the first!</p>
        <ol id="score-list" class="score-list" role="list" hidden></ol>
        <p id="score-status" class="sr-only" aria-live="polite"></p>
        <button id="clear-scores" class="clear-scores" type="button" hidden>Clear scores</button>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; 2026 Thom van der Vlugt
    </div>
  </footer>
</body>
</html>
